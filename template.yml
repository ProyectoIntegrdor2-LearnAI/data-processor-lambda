AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LearnIA Data Processor (S3 -> Lambda -> MongoDB + Bedrock embeddings) usando EventBridge

Parameters:
  Env:
    Type: String
    Default: dev
  IngestBucketName:
    Type: String
    Default: learnia-tempscraping-data
  AtlasUri:
    Type: String
  AwsRegion:
    Type: String
    Default: us-east-2
  EmbeddingProvider:
    Type: String
    Default: bedrock
  EmbeddingModel:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  EmbeddingDim:
    Type: Number
    Default: 1024

Globals:
  Function:
    Runtime: python3.12
    Timeout: 900  # 15 minutos (máximo permitido)
    MemorySize: 1024
    Architectures: [x86_64]
    CodeUri: src/
    Handler: data_processor_lambda.lambda_handler
    Environment:
      Variables:
        ATLAS_URI: !Ref AtlasUri
        DATABASE_NAME: learnia_db
        COLLECTION_NAME: courses
        S3_BUCKET: !Ref IngestBucketName
        EMBEDDING_PROVIDER: !Ref EmbeddingProvider
        EMBEDDING_MODEL: !Ref EmbeddingModel
        EMBEDDING_DIM: !Ref EmbeddingDim
        ATLAS_SEARCH_INDEX: default
        NUM_CANDIDATES_FACTOR: 30
        SEMANTIC_DEDUP_ENABLED: true
        SEMANTIC_DEDUP_MIN_DOCS: 200
        SEMANTIC_DEDUP_THRESHOLD: 0.97
        BATCH_SIZE: 50
        MAX_DOCS_PER_INVOCATION: 100  # Máximo de documentos por invocación Lambda
        DEDUP_KEY: url
        MAX_RETRIES: 5  # Aumentado de 3 a 5 para mejor resiliencia
        BEDROCK_RATE_LIMIT_DELAY: "1.2"  # 1.2s entre llamadas a Bedrock (500 docs en ~10 min)
        EMBEDDING_CACHE_MAX: "10000"  # Cache más grande para reducir llamadas a Bedrock

Resources:
  DataProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub learnia-data-processor-${Env}
      # NOTA: ReservedConcurrentExecutions comentado temporalmente por permisos IAM
      # Configurar manualmente después del despliegue con:
      # aws lambda put-function-concurrency --function-name learnia-data-processor-dev --reserved-concurrent-executions 1
      # ReservedConcurrentExecutions: 1
      # ✅ Aquí van las políticas
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:HeadObject
              Resource: !Sub arn:aws:s3:::${IngestBucketName}/*
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:learnia-data-processor-${Env}
      Events:
        S3JsonCreated:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [ "aws.s3" ]
              detail-type: [ "Object Created" ]
              detail:
                bucket:
                  name: [ !Ref IngestBucketName ]
                object:
                  key:
                    - suffix: ".json"

Outputs:
  FunctionName:
    Value: !Ref DataProcessorFunction
  FunctionArn:
    Value: !GetAtt DataProcessorFunction.Arn
